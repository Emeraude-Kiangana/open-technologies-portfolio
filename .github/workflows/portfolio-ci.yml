name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Support tests
        run: npm run test:support

      - name: Freelance service proof tests
        run: npm run test:freelance-proofs

      - name: Validate freelance offers
        run: npm run validate:offers

      - name: Validate case studies
        run: npm run validate:case-studies

      - name: Validate client intake
        run: npm run validate:intake

      - name: Secret scan
        run: npm run scan:secrets

      - name: Build static export
        run: npm run build
