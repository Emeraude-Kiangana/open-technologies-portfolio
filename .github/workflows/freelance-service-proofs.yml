name: Freelance Service Proof Packs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, proof/freelance-service-packs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: API automation proof
        run: node --test proofs/freelance/api-automation/adapter.test.mjs

  backend-prototype:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Backend prototype proof
        run: node --test proofs/freelance/backend-prototype/server.test.mjs

  dockerization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker versions
        run: |
          docker version
          docker compose version

      - name: Build and start proof service
        run: docker compose -f proofs/freelance/dockerization/compose.yaml up -d --build

      - name: Wait for healthy service
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health > /tmp/health.json; then
              cat /tmp/health.json
              grep -F '"status":"ok"' /tmp/health.json
              grep -F '"service":"dockerization-proof"' /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          docker compose -f proofs/freelance/dockerization/compose.yaml ps
          docker compose -f proofs/freelance/dockerization/compose.yaml logs
          exit 1

      - name: Verify container health
        shell: bash
        run: |
          container_id="$(docker compose -f proofs/freelance/dockerization/compose.yaml ps -q app)"
          test -n "$container_id"
          for attempt in {1..20}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$container_id")"
            echo "HEALTH_STATUS=$status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 1
          done
          docker inspect "$container_id"
          exit 1

      - name: Teardown
        if: always()
        run: docker compose -f proofs/freelance/dockerization/compose.yaml down -v
